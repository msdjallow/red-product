<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - RED Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#414141] flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-10 rounded shadow-2xl w-full max-w-md">
        <div class="flex items-center justify-center mb-8">
            <div class="bg-[#414141] p-2 rounded-full mr-2">
                <span class="text-white font-bold">R</span>
            </div>
            <h1 class="text-2xl font-bold text-[#414141]">RED PRODUCT</h1>
        </div>

        <h2 class="text-xl mb-6 text-gray-700 font-semibold">Inscrivez-vous en tant qu'Administrateur</h2>
        
        <form id="register-form" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-600 mb-1">Nom complet</label>
                <input type="text" id="name" required 
                    class="w-full px-4 py-2 border-b-2 border-gray-300 focus:border-[#414141] outline-none transition-colors">
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">E-mail</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-2 border-b-2 border-gray-300 focus:border-[#414141] outline-none transition-colors">
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">Mot de passe</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-2 border-b-2 border-gray-300 focus:border-[#414141] outline-none transition-colors">
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">Confirmer le mot de passe</label>
                <input type="password" id="confirm-password" required 
                    class="w-full px-4 py-2 border-b-2 border-gray-300 focus:border-[#414141] outline-none transition-colors">
            </div>
            
            <div class="flex items-center">
                <input type="checkbox" id="terms" required class="mr-2">
                <label for="terms" class="text-sm text-gray-600">Accepter les termes et conditions</label>
            </div>

            <button type="submit" 
                class="w-full bg-[#414141] text-white py-3 rounded font-semibold hover:bg-black transition-colors">
                S'inscrire
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                Vous avez déjà un compte ? <a href="index.html" class="text-yellow-600 font-bold hover:underline">Se connecter</a>
            </p>
        </div>
    </div>

    <!-- Liaison Scripts -->
    <script src="config.js"></script>
    <script src="register.js"></script>
</body>
</html>
