<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - RED Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#414141] flex items-center justify-center min-h-screen">

    <div class="bg-white p-10 rounded shadow-2xl w-full max-w-md">
        <!-- Logo ou Titre Maquette -->
        <div class="flex items-center justify-center mb-8">
            <div class="bg-[#414141] p-2 rounded-full mr-2">
                <span class="text-white font-bold">R</span>
            </div>
            <h1 class="text-2xl font-bold text-[#414141]">RED PRODUCT</h1>
        </div>

        <h2 class="text-xl mb-6 text-gray-700">Connectez-vous en tant qu'Administrateur</h2>
        
        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm text-gray-600 mb-1">E-mail</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-2 border-b-2 border-gray-300 focus:border-[#414141] outline-none transition-colors">
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">Mot de passe</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-2 border-b-2 border-gray-300 focus:border-[#414141] outline-none transition-colors">
            </div>
            
            <div class="flex items-center">
                <input type="checkbox" id="remember" class="mr-2">
                <label for="remember" class="text-sm text-gray-600">Garder ma session ouverte</label>
            </div>

            <button type="submit" 
                class="w-full bg-[#414141] text-white py-3 rounded font-semibold hover:bg-black transition-colors">
                Se connecter
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <a href="forgot-password.html" class="text-yellow-600 text-sm hover:underline">Mot de passe oublié ?</a>
            <p class="mt-2 text-sm text-gray-600">
                Vous n'avez pas de compte ? <a href="register.html" class="text-yellow-600 font-bold hover:underline">S'inscrire</a>
            </p>
        </div>
    </div>

    <!-- Liaison Scripts -->
    <script src="config.js"></script>
    <script src="login.js"></script>
</body>
</html>
